[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photo-date-classifier"
version = "0.1.0"
description = "Organize photos by date using EXIF data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Luis Rodriguez", email = "luis-rodriguez@users.noreply.github.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "exif>=1.6.0,<2.0",
    "tqdm>=4.66.0,<5.0",
    "click>=8.1.0,<9.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "pre-commit>=3.4.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
photo-date-classifier = "photo_date_classifier.cli:main"

[project.urls]
Homepage = "https://github.com/luis-rodriguez/photoclassification"
Repository = "https://github.com/luis-rodriguez/photoclassification"
Issues = "https://github.com/luis-rodriguez/photoclassification/issues"

[tool.hatchling.build.targets.wheel]
packages = ["src/photo_date_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=photo_date_classifier",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=30",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_optional = true

[[tool.mypy.overrides]]
module = "exif.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit
]
ignore = [
    "S603", # subprocess-without-shell-equals-true
    "S607", # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert in tests

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
